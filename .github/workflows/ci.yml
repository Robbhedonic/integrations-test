name: Node.js CI

on:
  push:
    branches: [ main, github-actions-setup ]
  pull_request:
    branches: [ main, github-actions-setup ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm test
      